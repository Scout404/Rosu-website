
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans); background: transparent; }
  .menu-section { margin-bottom: 2.5rem; }
  .cat-header { display: flex; align-items: center; gap: 10px; margin-bottom: 1rem; padding-bottom: 0.75rem; border-bottom: 0.5px solid var(--color-border-tertiary); }
  .cat-icon { font-size: 18px; }
  .cat-title { font-size: 18px; font-weight: 500; color: var(--color-text-primary); }
  .cat-count { font-size: 12px; color: var(--color-text-secondary); margin-left: auto; }
  .scroll-row { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 12px; scroll-snap-type: x mandatory; }
  .scroll-row::-webkit-scrollbar { height: 4px; }
  .scroll-row::-webkit-scrollbar-track { background: var(--color-background-secondary); border-radius: 4px; }
  .scroll-row::-webkit-scrollbar-thumb { background: var(--color-border-primary); border-radius: 4px; }
  .food-card { flex: 0 0 200px; scroll-snap-align: start; background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); overflow: hidden; transition: border-color 0.2s; cursor: pointer; }
  .food-card:hover { border-color: var(--color-border-secondary); }
  .card-img { width: 100%; height: 120px; object-fit: cover; display: block; background: var(--color-background-secondary); }
  .card-img-placeholder { width: 100%; height: 120px; background: var(--color-background-secondary); display: flex; align-items: center; justify-content: center; font-size: 32px; }
  .card-body { padding: 12px; }
  .card-name { font-size: 14px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 5px; line-height: 1.3; }
  .card-desc { font-size: 12px; color: var(--color-text-secondary); line-height: 1.5; margin-bottom: 10px; }
  .card-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .price-sm { font-size: 11px; color: var(--color-text-secondary); }
  .price-lg { font-size: 11px; color: var(--color-text-secondary); }
  .price-badge { background: var(--color-background-secondary); border-radius: 6px; padding: 3px 7px; font-size: 11px; font-weight: 500; color: var(--color-text-primary); }
  .tag-veg { display: inline-block; background: #e8f5e9; color: #2e7d32; font-size: 10px; font-weight: 500; padding: 1px 7px; border-radius: 100px; margin-left: 4px; }
  .page-pad { padding: 1.5rem 1rem 2rem; }
</style>

<div class="page-pad">
  <h2 style="sr-only">Rosu's Eetcafé menu</h2>

  <div id="menu-root"></div>
</div>

<script>
const categories = [
  {
    icon: "🍚",
    title: "Rijst",
    items: [
      { name: "Nasi met gebakken kip", desc: "Gebakken rijst met krokante stukjes kip en Surinaamse kruiden.", emoji: "🍳" },
      { name: "Witte rijst met kip", desc: "Gestoomde witte rijst geserveerd met malse gekruide kip.", emoji: "🍗" },
      { name: "Witte rijst met Pingo", desc: "Witte rijst met sappig wildvlees van de pingo (tapir).", emoji: "🥩" },
      { name: "Witte rijst met Pakira", desc: "Rijst met vlees van de pakira (wilde beer), zacht en aromatisch.", emoji: "🥩" },
      { name: "Witte rijst met Haas", desc: "Rijst met hazenbouten, langzaam gekruid en gestoofd.", emoji: "🥩" },
      { name: "Witte rijst met Hert", desc: "Witte rijst met mals hertenbiefstuk, authentiek Apora.", emoji: "🦌" },
      { name: "Witte rijst met gebakken vis", desc: "Verse riviervis, knapperig gebakken, geserveerd op rijst.", emoji: "🐟" },
      { name: "Moksi alesi", desc: "Traditionele Surinaamse mengrijst met bonen en vlees.", emoji: "🍲" },
    ]
  },
  {
    icon: "🍜",
    title: "Bamie",
    items: [
      { name: "Bamie met gebakken kip", desc: "Roergebakken noodles met knapperig gebakken kipstukjes.", emoji: "🍜" },
      { name: "Bamie met oven kip", desc: "Zachte noodles geserveerd met sappige ovengebakken kip.", emoji: "🍜" },
      { name: "Tjawmin met kip", desc: "Crispy gebakken mie met kip, Chinees-Surinaamse stijl.", emoji: "🥡" },
    ]
  },
  {
    icon: "🥣",
    title: "Soep",
    items: [
      { name: "Cassave soep", desc: "Rijkgevulde soep van verse cassave met kruiden en groenten.", emoji: "🥣" },
      { name: "Alla kondre soep", desc: "Traditionele 'alles uit het land' soep met lokale groenten en vlees.", emoji: "🍵" },
      { name: "Groenten soep", desc: "Lichte verse groentesoep, vegetarisch en voedzaam.", emoji: "🥦", veg: true },
      { name: "Peperpot (taboe)", desc: "Donkere stoofpot op basis van kassiri en kruiden, een klassieker.", emoji: "🫕" },
    ]
  },
  {
    icon: "🫓",
    title: "Roti",
    items: [
      { name: "Roti met kip (gele erwten)", desc: "Dunne roti met gele erwten, geserveerd met gekruide kip.", emoji: "🫓" },
      { name: "Roti met kip (oli roti)", desc: "Vette, zachte roti met heerlijk gemarineerde kip.", emoji: "🫓" },
      { name: "Roti met wildvlees", desc: "Traditionele roti geserveerd met vers lokaal wildvlees.", emoji: "🥩" },
      { name: "Roti met doks", desc: "Roti gevuld met doks (zoutvis), pittig en smaakvol.", emoji: "🐡" },
    ]
  },
  {
    icon: "🍝",
    title: "Pasta",
    items: [
      { name: "Macaroni", desc: "Smeuïge macaroni met Surinaamse saus, huisgemaakte stijl.", emoji: "🍝" },
      { name: "Alfredo pasta", desc: "Romige pasta in een rijke kaas-roomsaus, mild en comfortfood.", emoji: "🍝" },
    ]
  },
  {
    icon: "🧆",
    title: "Snacks",
    items: [
      { name: "Loempia", desc: "Krokante rolletjes gevuld met groenten en vlees.", emoji: "🥟" },
      { name: "Bara", desc: "Gefrituurde spliterwtenballetjes, zacht van binnen.", emoji: "🔵" },
      { name: "Kroket", desc: "Klassieke krokante kroket, vers gebakken.", emoji: "🥙" },
      { name: "Saucijzen brood", desc: "Zacht broodje gevuld met gekruide gehaktworst.", emoji: "🥐" },
      { name: "Pizza", desc: "Huisgemaakte pizza met verse lokale toppings.", emoji: "🍕" },
      { name: "Donuts", desc: "Zachte luchtige donuts, dagelijks vers gebakken.", emoji: "🍩" },
      { name: "Red belly", desc: "Lokale snack op basis van rood gekruid gehakt.", emoji: "🌶️" },
      { name: "Banaan chips", desc: "Krokant gefrituurde bananenschijfjes, licht gezouten.", emoji: "🍌" },
    ]
  },
  {
    icon: "🍞",
    title: "Brood",
    items: [
      { name: "Witte puntjes", desc: "Verse knapperige puntbroodjes, dagelijks gebakken.", emoji: "🥖" },
      { name: "Bake (Johnny cake)", desc: "Zachte gebakken bolletjes, een Caraïbische klassieker.", emoji: "🫓" },
    ]
  }
];

const root = document.getElementById('menu-root');

categories.forEach(cat => {
  const section = document.createElement('div');
  section.className = 'menu-section';

  const header = document.createElement('div');
  header.className = 'cat-header';
  header.innerHTML = `<span class="cat-icon">${cat.icon}</span><span class="cat-title">${cat.title}</span><span class="cat-count">${cat.items.length} gerechten</span>`;
  section.appendChild(header);

  const row = document.createElement('div');
  row.className = 'scroll-row';

  cat.items.forEach(item => {
    const card = document.createElement('div');
    card.className = 'food-card';
    card.innerHTML = `
      <div class="card-img-placeholder">${item.emoji}</div>
      <div class="card-body">
        <div class="card-name">${item.name}${item.veg ? '<span class="tag-veg">Veg</span>' : ''}</div>
        <div class="card-desc">${item.desc}</div>
        <div class="card-footer">
          <div>
            <span class="price-badge">250 <span style="font-weight:400;color:var(--color-text-secondary)">/ 300 SRD</span></span>
          </div>
          <span style="font-size:10px;color:var(--color-text-secondary)">klein / groot</span>
        </div>
      </div>
    `;
    row.appendChild(card);
  });

  section.appendChild(row);
  root.appendChild(section);
});
</script>
